name: Render U.S. Soundings

# Pulls U.S. radiosonde observations from the University of Wyoming upper-air
# archive and renders them with SounderPy/MetPy (scripts/sounding_data.py).
#
# The images are NOT committed to main — a 7-day archive of ~90 stations x 2
# launches/day would bloat the repo history. Instead they live on the orphan
# `sounding-data` branch, which is amended + force-pushed each run so it only
# ever holds one commit (the current rolling archive). Pages is redeployed
# from here because pushes made with GITHUB_TOKEN don't trigger pages.yml.

on:
  schedule:
    # UWyo usually has the 00Z/12Z data ~1-2 h after launch (06Z/18Z specials
    # likewise); later runs retry
    # stations that hadn't reported yet.
    - cron: '25 1,3,5,8,13,15,17,20 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Try every cycle in the 7-day window (not just the latest)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: sounding-data
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out existing sounding archive
        id: archive
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: sounding-data
          path: data/soundings
          fetch-depth: 1

      - name: Start a new archive branch (first run only)
        if: steps.archive.outcome != 'success'
        run: |
          rm -rf data/soundings
          mkdir -p data/soundings
          git -C data/soundings init -b sounding-data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-soundings.txt

      - name: Install SounderPy / MetPy
        run: pip install -r scripts/requirements-soundings.txt

      - name: Fetch from UWyo + render
        env:
          MPLBACKEND: Agg
        run: python scripts/sounding_data.py ${{ inputs.backfill && '--backfill' || '' }}

      - name: Publish archive to sounding-data branch
        id: publish
        working-directory: data/soundings
        run: |
          git config user.name "sounding-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          msg="Sounding archive $(date -u +%Y-%m-%dT%H:%MZ)"
          if git rev-parse --verify -q HEAD >/dev/null; then
            if git diff --cached --quiet; then
              echo "No changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git commit --amend --reset-author -m "$msg"
          else
            git commit -m "$msg"
          fi
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:sounding-data
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: render
    if: needs.render.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out sounding archive
        uses: actions/checkout@v4
        with:
          ref: sounding-data
          path: data/soundings
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site (main + sounding archive)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
